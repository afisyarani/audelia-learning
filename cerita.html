<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audelia • 50 Cerita Bahasa Melayu</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#27324b;background:#fff8ed}*{box-sizing:border-box}body{margin:0}header{background:#ffdd9a;padding:18px 16px;text-align:center}h1{font-size:clamp(24px,5vw,38px);margin:0}header p{margin:5px}.wrap{max-width:850px;margin:auto;padding:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:15px}button,select{border:0;border-radius:16px;padding:13px 16px;font-size:17px;font-weight:750;cursor:pointer;background:#e9e5ff;color:#332b60;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid #2c63c7}button.primary{background:#7857db;color:white}button.good{background:#d8f7dc;color:#246337}.paper{background:white;border:3px solid #ffe3ac;border-radius:28px;box-shadow:0 9px 25px #98734b1a;padding:clamp(18px,5vw,42px);text-align:center;min-height:390px}.emoji{font-size:72px}.paper h2{font-size:clamp(27px,5vw,39px);margin:8px 0 18px}.story{text-align:left;max-width:610px;margin:auto;font-size:var(--story-size,27px);line-height:1.9}.story p{margin:0 0 9px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.nav button{flex:1}.muted{color:#666b7c;font-size:14px}.progress{height:13px;background:#e9e1d6;border-radius:20px;overflow:hidden;margin:9px auto 16px;max-width:500px}.fill{height:100%;background:#5ab78c;width:0;transition:width .3s}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:15px}.tile{text-align:left;background:white;border:2px solid #ffe3ac;min-height:90px}.tile.done{border-color:#75cda1;background:#effff5}.hidden{display:none}.counter{text-align:center;font-weight:700;margin-bottom:8px}@media(max-width:420px){button,select{font-size:15px;padding:12px}.story{line-height:1.7}.paper{min-height:360px}}</style></head><body><header><h1>🌼 Cerita Audelia 🌼</h1><p>50 cerita pendek Bahasa Melayu • Jom membaca!</p></header><main class="wrap"><div class="toolbar"><button id="library">📚 Senarai cerita</button><button id="listen" class="primary">🔊 Dengar cerita</button><button id="stop">⏹ Berhenti</button><button id="small">A−</button><button id="large">A+</button></div><div id="reading"><div class="counter" id="counter"></div><div class="progress"><div class="fill" id="fill"></div></div><article class="paper"><div class="emoji" id="emoji"></div><h2 id="title"></h2><div class="story" id="story"></div><button class="good" id="complete">☆ Tandakan sudah baca</button><p class="muted" id="status"></p></article><div class="nav"><button id="prev">← Sebelum</button><button class="primary" id="next">Seterusnya →</button></div></div><section id="catalog" class="hidden"><h2>📚 Pilih cerita</h2><p id="summary"></p><div class="grid" id="tiles"></div></section><p class="muted" style="text-align:center">Kemajuan disimpan pada peranti ini. Suara bacaan bergantung pada suara Bahasa Melayu yang tersedia pada iPad atau pelayar.</p></main><script>
const stories=[{"title": "Kucing Comel", "emoji": "🐱", "text": "Mimi ada seekor kucing. Nama kucing itu ialah Tom. Tom suka minum susu. Mimi sayang akan Tom."}, {"title": "Bola Merah", "emoji": "⚽", "text": "Ali ada bola merah. Ali bermain di halaman rumah. Bola itu bergolek ke bawah pokok. Ali mengambil bola itu semula."}, {"title": "Pagi yang Cerah", "emoji": "🌞", "text": "Hari ini cuaca cerah. Sara bangun awal. Sara menggosok gigi dan mandi. Sara bersedia untuk ke sekolah."}, {"title": "Beg Sekolah", "emoji": "🎒", "text": "Aina ada beg biru. Di dalam beg ada buku dan pensel. Aina menyusun barang dengan kemas. Dia gembira pergi ke sekolah."}, {"title": "Pokok Mangga", "emoji": "🥭", "text": "Datuk menanam pokok mangga. Pokok itu semakin tinggi. Buah mangga sudah masak. Kami makan mangga yang manis."}, {"title": "Anak Itik", "emoji": "🦆", "text": "Ada tiga ekor anak itik. Anak itik mengikut ibu mereka. Mereka berenang di kolam kecil. Semua anak itik pulang bersama ibu."}, {"title": "Kek Hari Jadi", "emoji": "🎂", "text": "Hari ini hari jadi Hana. Ibu membuat kek coklat. Hana meniup lima batang lilin. Semua orang menyanyi dengan gembira."}, {"title": "Bas Kuning", "emoji": "🚌", "text": "Bas sekolah berwarna kuning. Amir menunggu bas bersama ayah. Bas tiba tepat pada masanya. Amir melambai kepada ayah."}, {"title": "Hujan Turun", "emoji": "🌧️", "text": "Awan gelap menutupi langit. Hujan mula turun. Nisa melihat titisan air di tingkap. Selepas hujan, udara terasa segar."}, {"title": "Pelangi Cantik", "emoji": "🌈", "text": "Hujan sudah berhenti. Ada pelangi di langit. Pelangi mempunyai banyak warna. Adik tersenyum melihat pelangi."}, {"title": "Arnab Putih", "emoji": "🐰", "text": "Seekor arnab putih tinggal di taman. Arnab itu suka makan lobak. Ia melompat dengan pantas. Adik melihat arnab dari jauh."}, {"title": "Kasih Ibu", "emoji": "❤️", "text": "Ibu memasak nasi untuk kami. Saya membantu menyusun pinggan. Selepas makan, saya mengucapkan terima kasih. Ibu memeluk saya."}, {"title": "Ayah dan Basikal", "emoji": "🚲", "text": "Ayah mengajar saya berbasikal. Saya memakai topi keledar. Ayah memegang basikal dengan cermat. Akhirnya saya boleh mengayuh sendiri."}, {"title": "Bunga Mawar", "emoji": "🌹", "text": "Ada bunga mawar di taman. Bunganya berwarna merah. Saya menyiram bunga setiap pagi. Bunga itu tumbuh dengan subur."}, {"title": "Ikan Emas", "emoji": "🐠", "text": "Rina memelihara ikan emas. Ikan itu berenang di dalam akuarium. Rina memberi ikan makanan yang sesuai. Air akuarium sentiasa bersih."}, {"title": "Pensel Baharu", "emoji": "✏️", "text": "Danish mendapat pensel baharu. Dia menulis namanya di buku. Tulisannya kemas dan cantik. Cikgu memuji usaha Danish."}, {"title": "Di Perpustakaan", "emoji": "📚", "text": "Lina pergi ke perpustakaan. Dia memilih buku bergambar. Lina membaca dengan suara perlahan. Dia memulangkan buku ke rak."}, {"title": "Kawan Baharu", "emoji": "🤝", "text": "Murid baharu bernama Mei masuk ke kelas. Farah mengajaknya bermain. Mereka berkongsi pensel warna. Kini mereka berkawan baik."}, {"title": "Burung Kecil", "emoji": "🐦", "text": "Seekor burung hinggap di dahan. Burung itu berkicau pada waktu pagi. Saya mendengar bunyinya dari tingkap. Burung itu terbang ke pokok lain."}, {"title": "Pisang Kuning", "emoji": "🍌", "text": "Nenek membeli pisang. Pisang itu berwarna kuning. Saya makan sebiji pisang selepas makan tengah hari. Rasanya manis dan sedap."}, {"title": "Pasar Pagi", "emoji": "🧺", "text": "Saya ikut ibu ke pasar. Kami membeli sayur dan buah. Penjual menyapa kami dengan ramah. Saya membantu ibu membawa beg kecil."}, {"title": "Kasut Hilang", "emoji": "👟", "text": "Afiq mencari kasutnya. Kasut itu tiada di rak. Dia melihat di bawah kerusi. Rupa-rupanya kasut ada di situ."}, {"title": "Main di Taman", "emoji": "🛝", "text": "Petang ini kami pergi ke taman. Saya bermain gelongsor. Adik bermain buaian bersama ibu. Kami pulang sebelum hari gelap."}, {"title": "Susu untuk Adik", "emoji": "🥛", "text": "Adik mahu minum susu. Ibu menyediakan susu untuk adik. Adik minum sambil duduk. Selepas itu, adik tersenyum puas."}, {"title": "Bintang di Langit", "emoji": "⭐", "text": "Malam ini langit cerah. Saya nampak banyak bintang. Ayah menunjukkan bulan yang terang. Kami melihat langit bersama-sama."}, {"title": "Rumah Bersih", "emoji": "🏠", "text": "Hari Sabtu kami mengemas rumah. Saya menyusun mainan di dalam kotak. Abang menyapu lantai. Rumah kami menjadi bersih."}, {"title": "Gigi Bersih", "emoji": "🪥", "text": "Saya memberus gigi setiap pagi. Saya juga memberus gigi sebelum tidur. Saya menggunakan berus gigi yang lembut. Gigi saya terasa bersih."}, {"title": "Tangan Bersih", "emoji": "🧼", "text": "Sebelum makan, saya membasuh tangan. Saya menggunakan sabun dan air. Saya menggosok tangan dengan teliti. Selepas itu, saya mengeringkan tangan."}, {"title": "Biskut untuk Nenek", "emoji": "🍪", "text": "Ibu membakar biskut. Saya membantu menyusun biskut di dalam bekas. Kami membawa biskut ke rumah nenek. Nenek berasa sangat gembira."}, {"title": "Kupu-kupu Cantik", "emoji": "🦋", "text": "Seekor kupu-kupu terbang di taman. Sayapnya berwarna-warni. Ia hinggap di atas bunga. Saya melihatnya tanpa mengganggu."}, {"title": "Gajah Besar", "emoji": "🐘", "text": "Saya melihat gajah di zoo. Gajah itu mempunyai belalai panjang. Ia makan daun dan rumput. Saya belajar tentang haiwan besar itu."}, {"title": "Singa di Zoo", "emoji": "🦁", "text": "Seekor singa berehat di bawah pokok. Bulunya berwarna perang. Kami melihat singa dari tempat yang selamat. Saya suka belajar tentang singa."}, {"title": "Hari Sukan", "emoji": "🏅", "text": "Sekolah mengadakan hari sukan. Saya berlari bersama kawan. Kami bersorak untuk semua peserta. Saya gembira walaupun tidak menang."}, {"title": "Layang-layang", "emoji": "🪁", "text": "Angin bertiup pada waktu petang. Ayah membawa layang-layang ke padang. Layang-layang terbang tinggi. Saya memegang talinya dengan kuat."}, {"title": "Kapal Kertas", "emoji": "⛵", "text": "Saya melipat sehelai kertas. Kertas itu menjadi kapal kecil. Saya meletakkannya di dalam besen air. Kapal kertas itu terapung."}, {"title": "Semut Rajin", "emoji": "🐜", "text": "Seekor semut menjumpai cebisan makanan. Semut itu memanggil kawannya. Mereka membawa makanan bersama-sama. Semut-semut itu sangat rajin."}, {"title": "Hadiah untuk Cikgu", "emoji": "🎁", "text": "Esok hari guru. Saya membuat kad untuk cikgu. Saya melukis bunga di atas kad. Cikgu tersenyum apabila menerimanya."}, {"title": "Makan Bersama", "emoji": "🍚", "text": "Kami duduk di meja makan. Ayah mengambil nasi. Ibu menghidangkan sayur. Kami makan bersama dengan gembira."}, {"title": "Taman Sayur", "emoji": "🥬", "text": "Atuk mempunyai kebun kecil. Ada sawi dan bayam di kebun. Saya membantu menyiram pokok. Atuk mengajar saya menjaga tanaman."}, {"title": "Kasut Hujan", "emoji": "🥾", "text": "Hujan turun pada waktu pagi. Dina memakai kasut hujan. Dia berjalan dengan berhati-hati. Kakinya kekal kering."}, {"title": "Anak Kambing", "emoji": "🐐", "text": "Anak kambing tinggal bersama ibunya. Bulunya lembut dan putih. Ia makan rumput di padang. Anak kambing berlari dengan riang."}, {"title": "Matahari Terbenam", "emoji": "🌅", "text": "Petang semakin lewat. Matahari kelihatan jingga. Kami melihat langit dari halaman. Tidak lama lagi, malam akan tiba."}, {"title": "Buku Kegemaran", "emoji": "📖", "text": "Saya mempunyai buku kegemaran. Buku itu penuh dengan gambar. Ibu membaca buku bersama saya. Saya mahu membacanya lagi esok."}, {"title": "Menolong Kawan", "emoji": "🤗", "text": "Pensel Iman terjatuh. Saya mengambil pensel itu. Iman mengucapkan terima kasih. Kami belajar saling membantu."}, {"title": "Anak Ayam", "emoji": "🐥", "text": "Ibu ayam berjalan di halaman. Lima ekor anak ayam mengikutnya. Mereka mencari makanan di tanah. Ibu ayam menjaga anak-anaknya."}, {"title": "Bulan Bulat", "emoji": "🌕", "text": "Bulan kelihatan bulat malam ini. Cahayanya menerangi langit. Saya melihat bulan bersama kakak. Kami mengucapkan selamat malam."}, {"title": "Buah Tembikai", "emoji": "🍉", "text": "Ayah memotong buah tembikai. Isinya merah dan berair. Kami makan tembikai yang sejuk. Saya membuang kulit ke dalam tong sampah."}, {"title": "Lawatan ke Pantai", "emoji": "🏖️", "text": "Kami pergi ke pantai pada hari Ahad. Saya membina istana pasir. Ibu memerhatikan saya bermain. Kami mengutip sampah sebelum pulang."}, {"title": "Payung Biru", "emoji": "☂️", "text": "Sofia membawa payung biru. Hujan turun selepas sekolah. Dia berkongsi payung dengan ibunya. Mereka berjalan pulang bersama-sama."}, {"title": "Selamat Malam", "emoji": "🌙", "text": "Saya menyimpan semua mainan. Kemudian saya memberus gigi. Ayah membacakan cerita pendek. Saya tidur dengan tenang."}];
const storageKey='audelia-malay-stories-v1';let done=[];try{done=JSON.parse(localStorage.getItem(storageKey)||'[]')}catch(e){};if(!Array.isArray(done))done=[];
let idx=0,size=27,showCatalog=false;const el=id=>document.getElementById(id);function stop(){if('speechSynthesis'in window)window.speechSynthesis.cancel();el('listen').textContent='🔊 Dengar cerita'}
function render(){let s=stories[idx];el('counter').textContent=`Cerita ${idx+1} daripada 50 · ⭐ ${done.length}/50 siap`;el('fill').style.width=(done.length/50*100)+'%';el('emoji').textContent=s.emoji;el('title').textContent=s.title;el('story').replaceChildren(...s.text.split(/(?<=\.)\s+/).map(sentence=>{let p=document.createElement('p');p.textContent=sentence;return p}));el('story').style.setProperty('--story-size',size+'px');el('complete').textContent=done.includes(idx)?'⭐ Sudah dibaca ✓':'☆ Tandakan sudah baca';el('status').textContent=done.includes(idx)?'Bagus! Teruskan membaca.':'Baca perlahan-lahan, satu ayat pada satu masa.';el('prev').disabled=idx===0;el('next').disabled=idx===49}
function view(i){stop();idx=i;showCatalog=false;el('reading').classList.remove('hidden');el('catalog').classList.add('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}
el('prev').onclick=()=>view(Math.max(0,idx-1));el('next').onclick=()=>view(Math.min(49,idx+1));el('complete').onclick=()=>{if(!done.includes(idx))done.push(idx);else done=done.filter(x=>x!==idx);try{localStorage.setItem(storageKey,JSON.stringify(done))}catch(e){}render()};el('small').onclick=()=>{size=Math.max(20,size-3);render()};el('large').onclick=()=>{size=Math.min(42,size+3);render()};el('stop').onclick=stop;
el('listen').onclick=()=>{if(!('speechSynthesis'in window)){alert('Pelayar ini tidak menyokong bacaan suara.');return}stop();const s=stories[idx];const u=new SpeechSynthesisUtterance(s.title+'. '+s.text);u.lang='ms-MY';u.rate=.78;u.pitch=1.05;const voices=speechSynthesis.getVoices();const ms=voices.find(v=>v.lang.toLowerCase()==='ms-my')||voices.find(v=>v.lang.toLowerCase().startsWith('ms'));if(ms)u.voice=ms;u.onend=()=>el('listen').textContent='🔊 Dengar cerita';u.onerror=()=>el('listen').textContent='🔊 Dengar cerita';speechSynthesis.speak(u);el('listen').textContent='🔊 Sedang membaca…'};
el('library').onclick=()=>{stop();showCatalog=!showCatalog;el('reading').classList.toggle('hidden',showCatalog);el('catalog').classList.toggle('hidden',!showCatalog);if(showCatalog){el('summary').textContent=`⭐ ${done.length} daripada 50 cerita sudah dibaca`;el('tiles').replaceChildren(...stories.map((s,i)=>{let b=document.createElement('button');b.className='tile'+(done.includes(i)?' done':'');b.textContent=`${s.emoji} ${i+1}. ${s.title}${done.includes(i)?' ✓':''}`;b.onclick=()=>view(i);return b}))}};render();
</script></body></html>
