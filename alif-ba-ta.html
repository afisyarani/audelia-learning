<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audelia Belajar Alif Ba Ta</title><style>body{font-family:system-ui,sans-serif;background:#fff6e9;color:#34304a;margin:0}header{text-align:center;background:#ffdb86;padding:24px 12px}h1{margin:0;font-size:2rem}main{max-width:850px;margin:auto;padding:16px}.tabs,.grid,.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}button{font:inherit;border:0;border-radius:16px;background:#fff;padding:13px 17px;box-shadow:0 3px 9px #0001;cursor:pointer;color:#342e50}button.active{background:#6b56cb;color:white}.card{background:white;border-radius:24px;padding:24px;margin:18px 0;text-align:center;box-shadow:0 5px 18px #0001}.arabic{font-family:'Geeza Pro','Noto Naskh Arabic','Traditional Arabic',serif;font-size:clamp(90px,20vw,170px);line-height:1.5;direction:rtl}.grid button{min-width:78px}.grid .glyph{font-family:'Geeza Pro','Traditional Arabic',serif;font-size:48px;display:block}.hint{color:#6b6380}.choice{min-width:115px;font-size:25px}.star{font-size:24px;color:#a26a00}#feedback{min-height:28px;font-weight:bold}footer{text-align:center;padding:20px;color:#6b6380}</style></head><body><header><h1>🌙 Audelia Belajar Alif Ba Ta</h1><p>Kenal huruf • Dengar sebutan • Main kuiz ⭐</p></header><main><nav class="tabs"><button onclick="mode('learn')" id="learnTab">📖 Huruf</button><button onclick="mode('baris')" id="barisTab">🎵 Baris</button><button onclick="mode('quiz')" id="quizTab">🎯 Kuiz</button></nav><div class="card"><div id="progress" class="star"></div><div id="mainContent"></div></div><div id="letters" class="grid"></div></main><footer>Belajar sedikit setiap hari bersama ibu dan ayah 💛<br>Audio bergantung pada suara Arab yang tersedia pada peranti.</footer><script>
const letters=[['ا','Alif','ا'],['ب','Ba','بَ'],['ت','Ta','تَ'],['ث','Tha','ثَ'],['ج','Jim','جَ'],['ح','Ha (ح)','حَ'],['خ','Kha','خَ'],['د','Dal','دَ'],['ذ','Dzal','ذَ'],['ر','Ra','رَ'],['ز','Zai','زَ'],['س','Sin','سَ'],['ش','Syin','شَ'],['ص','Sad','صَ'],['ض','Dad','ضَ'],['ط','To','طَ'],['ظ','Zo','ظَ'],['ع','Ain','عَ'],['غ','Ghain','غَ'],['ف','Fa','فَ'],['ق','Qaf','قَ'],['ك','Kaf','كَ'],['ل','Lam','لَ'],['م','Mim','مَ'],['ن','Nun','نَ'],['و','Wau','وَ'],['ه','Ha (ه)','هَ'],['ي','Ya','يَ']];let idx=0,tab='learn',score=Number(localStorage.getItem('audelia_hijaiyah_stars')||0),question=null;function say(t){if(!('speechSynthesis'in window)){alert('Audio tidak tersedia pada pelayar ini.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.72;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ar'));if(v)u.voice=v;speechSynthesis.speak(u)}function mode(m){tab=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(m+'Tab').classList.add('active');render()}function select(i){idx=i;render();say(letters[idx][2])}function render(){document.getElementById('progress').textContent='⭐ Bintang terkumpul: '+score;let c=document.getElementById('mainContent'),g=document.getElementById('letters');g.innerHTML='';if(tab==='learn'){let x=letters[idx];c.innerHTML=`<p class="hint">Huruf ${idx+1} daripada 28</p><div class="arabic">${x[0]}</div><h2>${x[1]}</h2><div class="actions"><button onclick="say(letters[idx][2])">🔊 Dengar</button><button onclick="idx=(idx+27)%28;render()">⬅ Sebelum</button><button onclick="idx=(idx+1)%28;render()">Seterusnya ➡</button></div>`;letters.forEach((x,i)=>{let b=document.createElement('button');b.innerHTML=`<span class="glyph">${x[0]}</span>${x[1]}`;b.onclick=()=>select(i);g.appendChild(b)})}else if(tab==='baris'){let x=letters[idx],base=x[0]==='ا'?'أ':x[0];c.innerHTML=`<p>Latihan baris: ${x[1]}</p><div class="arabic">${base}</div><div class="actions"><button onclick="say('${base}َ')">${base}َ 🔊 Atas (a)</button><button onclick="say('${base}ِ')">${base}ِ 🔊 Bawah (i)</button><button onclick="say('${base}ُ')">${base}ُ 🔊 Depan (u)</button></div><p class="hint">Sebutan untuk Alif menggunakan bentuk hamzah sebagai contoh bunyi vokal.</p><div class="actions"><button onclick="idx=(idx+27)%28;render()">⬅</button><button onclick="idx=(idx+1)%28;render()">➡</button></div>`}else{if(!question)newQuestion();let q=question;c.innerHTML=`<h2>Yang mana huruf ${letters[q.answer][1]}?</h2><p>Tekan jawapan yang betul</p><div class="actions">${q.options.map(i=>`<button class="choice" onclick="answer(${i})">${letters[i][0]}</button>`).join('')}</div><p id="feedback"></p><button onclick="say(letters[question.answer][2])">🔊 Dengar bunyi</button>`}}function newQuestion(){let a=Math.floor(Math.random()*28),opts=[a];while(opts.length<4){let n=Math.floor(Math.random()*28);if(!opts.includes(n))opts.push(n)}opts.sort(()=>Math.random()-.5);question={answer:a,options:opts}}function answer(i){let f=document.getElementById('feedback');if(i===question.answer){score++;localStorage.setItem('audelia_hijaiyah_stars',score);f.textContent='🎉 Betul! Hebat Audelia!';say(letters[i][2]);setTimeout(()=>{newQuestion();render()},850)}else{f.textContent='Cuba lagi! 💪'}}mode('learn');</script><a href="index.html" aria-label="Back to Audelia Learning World" style="position:fixed;bottom:18px;left:18px;z-index:2147483647;background:#273b77;color:white;text-decoration:none;padding:12px 17px;border-radius:30px;font:bold 15px system-ui,sans-serif;box-shadow:0 5px 18px #0004;border:2px solid white">🏠 Home</a></body></html>
