<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Coding for Kids — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🤖 Coding for Kids</h1><p>Follow simple instructions</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>let i=0,patterns=[['⬆️','➡️','⬆️'],['⬅️','⬇️','➡️'],['➡️','➡️','⬆️'],['⬇️','⬅️','⬆️']];function show(){let p=patterns[i%patterns.length],idx=rand(3),a=p[idx];choices(`<div class="big">🤖</div><p>Follow the robot's moves:</p><div class="big" style="font-size:35px">${p.map((x,j)=>j===idx?'❓':x).join(' ')}</div><p>Which arrow is missing?</p>`,['⬆️','⬇️','⬅️','➡️'],a,()=>{i++;show()})}show();</script></body></html>
