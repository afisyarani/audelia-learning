<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Music &amp; Rhythm — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🎵 Music &amp; Rhythm</h1><p>Make your own beats</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>info('<p>Tap the drums to make your own rhythm! 🎶</p><div id="drums" class="options"></div><p>Try this pattern: 1 - 2 - 1 - 3</p>');let ac;function beat(freq){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.26)}catch(e){$('#feedback').textContent='Audio not supported'}}[220,330,440,550].forEach((f,i)=>{let b=document.createElement('button');b.textContent=['🥁 1','🎹 2','🔔 3','🎵 4'][i];b.onclick=()=>{beat(f);score++;$('#score').textContent='🎵 '+score};$('#drums').append(b)});</script></body></html>
