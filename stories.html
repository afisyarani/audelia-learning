<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffe9f2"><title>Audelia's Story Garden — 50 English Stories</title><style>
:root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#34324b;background:#fff8f2}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#ffe0ee,#fff0ba);padding:22px 18px;text-align:center}h1{margin:0;font-size:clamp(25px,5vw,39px)}header p{margin:7px 0}.wrap{max-width:1100px;margin:auto;padding:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px;align-items:center}button,select{font:inherit;border:2px solid #ded5ef;border-radius:15px;background:white;padding:11px 15px;color:#34324b;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #9a73ed}button.primary{background:#7356ce;color:white;border-color:#7356ce;font-weight:bold}button.active{background:#ffe2a8;border-color:#efb951}input[type=search]{font:inherit;min-width:170px;flex:1;padding:12px;border:2px solid #ded5ef;border-radius:15px}.stats{font-weight:bold;color:#68569a}.layout{display:grid;grid-template-columns:310px 1fr;gap:18px}.library{max-height:68vh;overflow:auto;border:2px solid #f1e5e5;border-radius:20px;background:white;padding:10px}.storybtn{width:100%;display:flex;text-align:left;align-items:center;gap:12px;margin:5px 0;border:0;background:#fff9f6}.storybtn.active{background:#efe8ff}.storybtn .em{font-size:30px}.storybtn small{display:block;color:#766f84;margin-top:3px}.reader{background:white;border:2px solid #f1e5e5;border-radius:24px;padding:clamp(18px,4vw,36px);min-height:480px}.hero{text-align:center}.hero .em{font-size:clamp(68px,12vw,112px);line-height:1.3}.hero h2{font-size:clamp(25px,4vw,36px);margin:4px 0}.tag{display:inline-block;background:#e8f6e9;padding:5px 12px;border-radius:50px;color:#376846;font-size:14px}.storytext{line-height:1.9;font-size:var(--reading-size,27px);max-width:670px;margin:20px auto;white-space:pre-line}.storytext span{display:block;margin:0 0 7px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.bottom{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.muted{color:#706c7b;font-size:14px}.done{color:#258453;font-weight:bold}footer{text-align:center;padding:24px;color:#706c7b}@media(max-width:750px){.layout{grid-template-columns:1fr}.library{display:flex;overflow-x:auto;max-height:none;gap:6px;padding:8px}.storybtn{min-width:165px;width:165px;flex-shrink:0}.reader{min-height:0}.storytext{font-size:var(--reading-size,25px)}}@media(prefers-reduced-motion:no-preference){button{transition:transform .12s}button:active{transform:scale(.97)}}
</style></head><body><header><h1>🌷 Audelia's Story Garden 📚</h1><p>50 little English stories • Read, listen, and grow!</p><div class="stats" id="progress">0 of 50 stories read</div></header><main class="wrap"><div class="toolbar"><input id="search" type="search" placeholder="Find a story..." aria-label="Search stories"><select id="category" aria-label="Choose topic"><option value="All">All topics</option></select><button id="smaller" aria-label="Make text smaller">A−</button><button id="bigger" aria-label="Make text bigger">A+</button></div><div class="layout"><nav class="library" id="library" aria-label="Story library"></nav><article class="reader"><div class="hero"><div class="em" id="emoji">📖</div><span class="tag" id="topic"></span><h2 id="title"></h2><div class="muted" id="position"></div></div><div class="storytext" id="story"></div><div class="actions"><button class="primary" id="read">🔊 Read aloud</button><button id="stop">⏹ Stop</button><button id="mark">⭐ Mark as read</button></div><div class="bottom"><button id="prev">← Previous</button><span class="muted" id="status" aria-live="polite"></span><button id="next">Next →</button></div></article></div></main><footer>Made for little readers 💖 • Audio uses your device's English voice.</footer><script>
const STORIES=[{"id": 1, "title": "The Little Red Ball", "category": "Play", "emoji": "🔴", "text": "Mia has a red ball. She rolls it on the grass. The ball goes under a tree. A puppy finds the ball. Mia says, “Thank you, puppy!” They play together."}, {"id": 2, "title": "Ben and the Big Cat", "category": "Animals", "emoji": "🐈", "text": "Ben sees a big cat. The cat sits on a mat. Ben gives it some water. The cat drinks and purrs. Ben smiles at his new friend."}, {"id": 3, "title": "The Happy Sun", "category": "Nature", "emoji": "☀️", "text": "The sun wakes up early. It shines on the flowers. It shines on the trees. Ella opens her window. “Good morning, sun!” she says."}, {"id": 4, "title": "A Rainy Day", "category": "Nature", "emoji": "🌧️", "text": "Rain taps on the roof. Sam puts on his yellow boots. He jumps in a small puddle. Splash! His socks stay dry. Sam loves rainy days."}, {"id": 5, "title": "My Blue Kite", "category": "Play", "emoji": "🪁", "text": "I have a blue kite. Dad helps me fly it. The wind lifts it high. The kite dances in the sky. I clap my hands with joy."}, {"id": 6, "title": "The Sleepy Bunny", "category": "Animals", "emoji": "🐰", "text": "A little bunny is tired. She hops to her soft bed. She hugs her tiny carrot toy. The moon shines outside. Soon, the bunny is asleep."}, {"id": 7, "title": "The Lost Sock", "category": "Home", "emoji": "🧦", "text": "Lily has one pink sock. Where is the other sock? She looks under her bed. She looks in her shoe. Oh! The sock is on her teddy bear."}, {"id": 8, "title": "Tom Makes Toast", "category": "Food", "emoji": "🍞", "text": "Tom wants some toast. Mum puts bread in the toaster. Pop! The toast is ready. Tom adds a little butter. He eats it with a big smile."}, {"id": 9, "title": "The Tiny Ant", "category": "Animals", "emoji": "🐜", "text": "A tiny ant finds a crumb. The crumb is very big. The ant calls her friends. They lift it together. The ants carry the crumb home."}, {"id": 10, "title": "The Yellow Bus", "category": "School", "emoji": "🚌", "text": "The yellow bus stops near my home. I wave to Mum. I sit next to my friend. We see trees and shops. Soon, we reach our school."}, {"id": 11, "title": "A Gift for Mum", "category": "Family", "emoji": "🎁", "text": "Nina wants to make a gift. She draws a big heart. She colours it red and pink. She gives it to Mum. Mum hugs Nina and says, “I love it!”"}, {"id": 12, "title": "The Dancing Duck", "category": "Animals", "emoji": "🦆", "text": "A duck walks by the pond. It shakes its tail. It flaps its wings. Two little ducks copy the dance. Quack, quack! They all have fun."}, {"id": 13, "title": "My New Shoes", "category": "Home", "emoji": "👟", "text": "I have new green shoes. I put them on my feet. I walk to the door. I run across the yard. My shoes feel light and comfy."}, {"id": 14, "title": "The Friendly Moon", "category": "Bedtime", "emoji": "🌙", "text": "The moon is round and bright. It looks through my window. I tell the moon about my day. The stars twinkle nearby. I close my eyes and sleep."}, {"id": 15, "title": "A Picnic in the Park", "category": "Family", "emoji": "🧺", "text": "Dad packs apples and sandwiches. We go to the park. We sit under a big tree. A bird sings above us. We share our lunch and laugh."}, {"id": 16, "title": "The Little Fish", "category": "Animals", "emoji": "🐟", "text": "A little fish swims in a pond. It sees a green leaf. It swims around a rock. Then it finds its fish family. They swim home together."}, {"id": 17, "title": "Where Is Teddy?", "category": "Home", "emoji": "🧸", "text": "Amy cannot find Teddy. She looks on the sofa. She looks behind the door. She hears a soft bump. Teddy is in her toy box!"}, {"id": 18, "title": "The Magic Seed", "category": "Nature", "emoji": "🌱", "text": "Leo plants a tiny seed. He gives it water each day. A small green shoot pops up. Soon, a flower opens. Leo says, “You grew so tall!”"}, {"id": 19, "title": "The Kind Elephant", "category": "Animals", "emoji": "🐘", "text": "An elephant sees a thirsty bird. The bird cannot reach the water. The elephant fills its trunk. It sprays a little water into a leaf. The bird drinks happily."}, {"id": 20, "title": "Five Little Stars", "category": "Bedtime", "emoji": "⭐", "text": "I see five stars in the sky. One hides behind a cloud. Now I see four. The cloud moves away. All five stars shine again."}, {"id": 21, "title": "The Big Birthday Cake", "category": "Family", "emoji": "🎂", "text": "Today is Ava’s birthday. Her family makes a cake. It has five little candles. Ava makes a wish. Everyone sings and claps."}, {"id": 22, "title": "Max Learns to Share", "category": "Friends", "emoji": "🚗", "text": "Max has two toy cars. His friend Jay wants to play. Max gives Jay the blue car. They race the cars together. Sharing makes the game more fun."}, {"id": 23, "title": "The Brave Little Bird", "category": "Animals", "emoji": "🐦", "text": "A small bird stands on a branch. She wants to fly. She flaps her wings once. Then she flaps them again. Up she goes into the sky!"}, {"id": 24, "title": "A Day at the Beach", "category": "Nature", "emoji": "🏖️", "text": "We go to the beach. The sand feels warm. I build a little castle. A wave washes near my toes. I laugh and build again."}, {"id": 25, "title": "The Rainbow Surprise", "category": "Nature", "emoji": "🌈", "text": "The rain stops at last. The sun comes out. Sara looks up at the sky. A rainbow shines above the houses. She counts its bright colours."}, {"id": 26, "title": "Pip the Puppy", "category": "Animals", "emoji": "🐶", "text": "Pip is a playful puppy. He chases a soft ball. He trips over his own paws. Then he gets up and tries again. Pip never gives up."}, {"id": 27, "title": "The School Garden", "category": "School", "emoji": "🌻", "text": "Our class has a garden. We plant little flowers. We water them every morning. A butterfly visits one day. We are proud of our garden."}, {"id": 28, "title": "A Very Tall Giraffe", "category": "Animals", "emoji": "🦒", "text": "Gina the giraffe is very tall. She sees leaves high in a tree. A small goat cannot reach them. Gina pulls down a branch. They eat together."}, {"id": 29, "title": "The Missing Crayon", "category": "School", "emoji": "🖍️", "text": "I want to draw a sun. My yellow crayon is missing. I check my pencil box. My friend finds it on the floor. I say, “Thank you!”"}, {"id": 30, "title": "Grandma’s Cookies", "category": "Family", "emoji": "🍪", "text": "Grandma makes little cookies. I help mix the dough. We make round shapes. The kitchen smells sweet. We wait for the cookies to cool."}, {"id": 31, "title": "The Quiet Turtle", "category": "Animals", "emoji": "🐢", "text": "Toby the turtle walks slowly. His friends run ahead. Toby keeps walking. At last, he reaches the pond. His friends cheer for him."}, {"id": 32, "title": "The Paper Boat", "category": "Play", "emoji": "⛵", "text": "I fold a little paper boat. I put it in a shallow puddle. The boat floats on the water. A soft wind pushes it. I watch it sail away."}, {"id": 33, "title": "Good Morning, School!", "category": "School", "emoji": "🏫", "text": "I put my bag on my back. I wave goodbye at the gate. My teacher says hello. I sit with my friends. We are ready to learn."}, {"id": 34, "title": "The Hungry Monkey", "category": "Animals", "emoji": "🐒", "text": "Momo the monkey feels hungry. He sees a banana on the table. He asks his friend for one. His friend says yes. Momo says thank you."}, {"id": 35, "title": "My Little Sister", "category": "Family", "emoji": "👶", "text": "My little sister likes to giggle. I show her my funny face. She laughs and kicks her feet. I sing a soft song. She smiles at me."}, {"id": 36, "title": "The Snowy Hill", "category": "Nature", "emoji": "⛄", "text": "Snow covers the little hill. May wears her warm coat. She makes a tiny snowman. She gives it a carrot nose. Then she waves goodbye."}, {"id": 37, "title": "The Noisy Farm", "category": "Animals", "emoji": "🐄", "text": "A cow says moo. A sheep says baa. A duck says quack. The farmer brings them breakfast. The farm is full of happy sounds."}, {"id": 38, "title": "The Purple Umbrella", "category": "Home", "emoji": "☂️", "text": "Ria has a purple umbrella. She takes it outside in the rain. Her friend forgot an umbrella. Ria moves closer to share. They walk home together."}, {"id": 39, "title": "The Little Train", "category": "Play", "emoji": "🚂", "text": "A little train goes choo-choo. It passes a green field. It passes a blue river. The children wave from the window. The train reaches the station."}, {"id": 40, "title": "The Star Sticker", "category": "School", "emoji": "🌟", "text": "Noah tries to write his name. The first letter is hard. He tries again slowly. His teacher gives him a star sticker. Noah feels proud."}, {"id": 41, "title": "The Baby Dolphin", "category": "Animals", "emoji": "🐬", "text": "A baby dolphin swims beside Mum. It jumps above the water. Splash! It dives back down. Mum swims close by. They play in the sea."}, {"id": 42, "title": "The Orange Butterfly", "category": "Nature", "emoji": "🦋", "text": "An orange butterfly lands on a flower. It opens its pretty wings. A soft breeze blows. The butterfly flies to another flower. I watch it quietly."}, {"id": 43, "title": "A Cup of Water", "category": "Home", "emoji": "💧", "text": "I play outside and feel thirsty. I go inside to get water. I fill my cup carefully. I drink the cool water. Then I put my cup away."}, {"id": 44, "title": "The Little Robot", "category": "Play", "emoji": "🤖", "text": "Rob the robot has two bright eyes. He can wave his arms. He can turn around. One day, he learns to dance. His friends clap for him."}, {"id": 45, "title": "The Best Team", "category": "Friends", "emoji": "⚽", "text": "Ali and Mei play with a ball. The ball rolls into the grass. They look for it together. Mei finds it near a tree. They cheer for their team."}, {"id": 46, "title": "The Bedtime Book", "category": "Bedtime", "emoji": "📖", "text": "Dad opens my favourite book. I sit beside him. We read about a little bear. I turn the last page. Dad says good night and hugs me."}, {"id": 47, "title": "The Green Frog", "category": "Animals", "emoji": "🐸", "text": "A green frog sits on a leaf. It sees a tiny fly. The frog jumps to another leaf. Plop! It lands near the pond. The frog croaks happily."}, {"id": 48, "title": "The Toy Shop Window", "category": "Play", "emoji": "🪀", "text": "Ella sees a toy shop window. There is a red drum and a blue kite. She likes the little puzzle best. She counts the puzzle pieces. Then she walks home with Dad."}, {"id": 49, "title": "A Thank-You Note", "category": "Friends", "emoji": "💌", "text": "My friend helps me pick up my books. I want to say thank you. I draw a flower on a card. I write two kind words. My friend smiles."}, {"id": 50, "title": "The Little Night Light", "category": "Bedtime", "emoji": "🛏️", "text": "My room is dark at night. Mum turns on a little light. It glows like a tiny star. I hug my pillow. I feel safe and fall asleep."}];
const $=id=>document.getElementById(id);
let selected=0, size=Number(localStorage.getItem('audelia_story_size')||27), completed=new Set(JSON.parse(localStorage.getItem('audelia_story_done')||'[]'));
function filtered(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value;return STORIES.filter(s=>(cat==='All'||s.category===cat)&&(s.title.toLowerCase().includes(q)||s.text.toLowerCase().includes(q)));}
function renderList(){const lib=$('library');lib.replaceChildren();const arr=filtered();if(!arr.length){lib.textContent='No stories found.';return;}arr.forEach(s=>{let b=document.createElement('button');b.className='storybtn'+(selected===s.id-1?' active':'');b.setAttribute('aria-current',selected===s.id-1?'true':'false');let em=document.createElement('span');em.className='em';em.textContent=s.emoji;let txt=document.createElement('span');txt.textContent=s.title;let sm=document.createElement('small');sm.textContent=s.category+(completed.has(s.id)?' • ✓ Read':'');txt.appendChild(sm);b.append(em,txt);b.onclick=()=>show(s.id-1);lib.appendChild(b);});}
function stop(){if('speechSynthesis' in window)speechSynthesis.cancel();$('status').textContent='';}
function show(idx){stop();selected=(idx+STORIES.length)%STORIES.length;const s=STORIES[selected];$('emoji').textContent=s.emoji;$('topic').textContent=s.category;$('title').textContent=s.title;$('position').textContent=`Story ${s.id} of 50`;$('story').replaceChildren();s.text.split(/(?<=[.!?])\s+(?=[A-Z“])/).forEach(line=>{const span=document.createElement('span');span.textContent=line;$('story').appendChild(span);});$('mark').textContent=completed.has(s.id)?'✅ Read! (undo)':'⭐ Mark as read';$('progress').textContent=`${completed.size} of 50 stories read`;document.documentElement.style.setProperty('--reading-size',size+'px');renderList();}
$('read').onclick=()=>{stop();if(!('speechSynthesis' in window)){$('status').textContent='Audio not supported in this browser.';return;}let u=new SpeechSynthesisUtterance(STORIES[selected].text);u.lang='en-GB';u.rate=.78;u.pitch=1.08;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('en')&&v.name.toLowerCase().includes('female'))||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;u.onstart=()=>$('status').textContent='Reading aloud…';u.onend=()=>$('status').textContent='Finished reading!';u.onerror=()=>$('status').textContent='Could not play audio. Try again.';speechSynthesis.speak(u);};
$('stop').onclick=stop;$('mark').onclick=()=>{const id=STORIES[selected].id;if(completed.has(id))completed.delete(id);else completed.add(id);localStorage.setItem('audelia_story_done',JSON.stringify([...completed]));show(selected);};$('prev').onclick=()=>show(selected-1);$('next').onclick=()=>show(selected+1);$('search').oninput=renderList;$('category').onchange=renderList;$('smaller').onclick=()=>{size=Math.max(18,size-3);localStorage.setItem('audelia_story_size',size);show(selected);};$('bigger').onclick=()=>{size=Math.min(48,size+3);localStorage.setItem('audelia_story_size',size);show(selected);};[...new Set(STORIES.map(s=>s.category))].sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('category').appendChild(o);});show(0);window.addEventListener('pagehide',stop);
</script><a href="index.html" aria-label="Back to Audelia Learning World" style="position:fixed;bottom:18px;left:18px;z-index:2147483647;background:#273b77;color:white;text-decoration:none;padding:12px 17px;border-radius:30px;font:bold 15px system-ui,sans-serif;box-shadow:0 5px 18px #0004;border:2px solid white">🏠 Home</a></body></html>
