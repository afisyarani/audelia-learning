<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audelia Colouring Book — 100 Pictures</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8f0;color:#26314f;font-family:system-ui,-apple-system,sans-serif}header{padding:20px;text-align:center;color:white;background:linear-gradient(115deg,#f16cb1,#8060eb,#43c4db)}h1{margin:0;font-size:clamp(24px,5vw,40px)}header p{margin:5px}.wrap{max-width:1050px;margin:auto;padding:14px}.tools,.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}button,a.tool,select{border:0;border-radius:13px;padding:12px;background:white;color:#293454;font-weight:750;font-size:15px;min-height:45px;cursor:pointer;box-shadow:0 2px 8px #0001;text-decoration:none}.primary,.active{background:#6853dd!important;color:white!important}.layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px}.sheet,.side{background:white;border-radius:22px;padding:14px;box-shadow:0 4px 18px #0001}.sheet h2{text-align:center;margin:0 0 8px}.canvasbox{position:relative;width:100%;aspect-ratio:1.12;background:white;border:2px solid #e9e5ef;border-radius:16px;overflow:hidden;touch-action:none}.picture{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:clamp(130px,30vw,290px);filter:grayscale(1) contrast(1.35);opacity:.28;pointer-events:none;user-select:none}.canvasbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.swatch{aspect-ratio:1;border:3px solid white;border-radius:50%;box-shadow:0 0 0 1px #bbb}.swatch.active{box-shadow:0 0 0 4px #6853dd}.browse{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:310px;overflow:auto}.browse button{font-size:12px;text-align:left;padding:9px}.hint{color:#667087;font-size:13px;line-height:1.5}.counter{font-weight:800}.side h3{margin:10px 0}.label{font-size:13px;font-weight:750}input[type=range]{width:100%}@media(max-width:720px){.layout{grid-template-columns:1fr}.palette{grid-template-columns:repeat(10,1fr)}.browse{grid-template-columns:repeat(3,1fr);max-height:145px}.picture{font-size:clamp(130px,40vw,240px)}}@media print{header,.tools,.side,.filters{display:none!important}.layout{display:block}.sheet{box-shadow:none}.canvasbox{height:75vh}}
</style></head><body><header><h1>🎨 Audelia's Colouring Book</h1><p>100 matching pictures • Draw with your finger or Apple Pencil</p></header><main class="wrap"><div class="tools"><a class="tool" href="index.html">🏠 Home</a><button id="prev">◀ Previous</button><span class="counter" id="counter"></span><button id="next" class="primary">Next ▶</button><button id="undo">↶ Undo</button><button id="clear">🧼 Clear</button><button id="save">⬇ Save PNG</button></div><div class="layout"><section class="sheet"><h2 id="title"></h2><div class="canvasbox" id="canvasbox"><div class="picture" id="picture"></div><canvas id="canvas"></canvas></div><p class="hint">The pale picture is a matching reference. Draw and colour over it. This version uses freehand colouring, not tap-to-fill.</p></section><aside class="side"><h3>🌈 Colours</h3><div class="palette" id="palette"></div><p class="label">Brush size</p><input type="range" id="brush" min="3" max="40" value="15"><div class="filters" id="filters"></div><h3>📚 Choose a page</h3><div class="browse" id="browse"></div></aside></div></main><script>
const pages=[["Cat", "Animals"], ["Dog", "Animals"], ["Rabbit", "Animals"], ["Elephant", "Animals"], ["Lion", "Animals"], ["Tiger", "Animals"], ["Bear", "Animals"], ["Panda", "Animals"], ["Monkey", "Animals"], ["Giraffe", "Animals"], ["Zebra", "Animals"], ["Hippo", "Animals"], ["Crocodile", "Animals"], ["Turtle", "Animals"], ["Butterfly", "Animals"], ["Bee", "Animals"], ["Fish", "Animals"], ["Dolphin", "Animals"], ["Whale", "Animals"], ["Octopus", "Animals"], ["Penguin", "Animals"], ["Owl", "Animals"], ["Parrot", "Animals"], ["Frog", "Animals"], ["Horse", "Animals"], ["Apple", "Fruits"], ["Banana", "Fruits"], ["Orange", "Fruits"], ["Strawberry", "Fruits"], ["Watermelon", "Fruits"], ["Pineapple", "Fruits"], ["Grapes", "Fruits"], ["Mango", "Fruits"], ["Pear", "Fruits"], ["Cherry", "Fruits"], ["Peach", "Fruits"], ["Lemon", "Fruits"], ["Kiwi", "Fruits"], ["Papaya", "Fruits"], ["Dragon Fruit", "Fruits"], ["Carrot", "Vegetables"], ["Broccoli", "Vegetables"], ["Tomato", "Vegetables"], ["Corn", "Vegetables"], ["Pumpkin", "Vegetables"], ["Eggplant", "Vegetables"], ["Cucumber", "Vegetables"], ["Pepper", "Vegetables"], ["Mushroom", "Vegetables"], ["Potato", "Vegetables"], ["Onion", "Vegetables"], ["Cabbage", "Vegetables"], ["Peas", "Vegetables"], ["Radish", "Vegetables"], ["Lettuce", "Vegetables"], ["Car", "Vehicles"], ["Bus", "Vehicles"], ["Truck", "Vehicles"], ["Train", "Vehicles"], ["Airplane", "Vehicles"], ["Helicopter", "Vehicles"], ["Boat", "Vehicles"], ["Sailboat", "Vehicles"], ["Bicycle", "Vehicles"], ["Motorcycle", "Vehicles"], ["Fire Engine", "Vehicles"], ["Ambulance", "Vehicles"], ["Rocket", "Vehicles"], ["Tractor", "Vehicles"], ["Submarine", "Vehicles"], ["Princess", "Fairy Tales"], ["Prince", "Fairy Tales"], ["Fairy", "Fairy Tales"], ["Mermaid", "Fairy Tales"], ["Unicorn", "Fairy Tales"], ["Dragon", "Fairy Tales"], ["Castle", "Fairy Tales"], ["Magic Wand", "Fairy Tales"], ["Glass Slipper", "Fairy Tales"], ["Pumpkin Carriage", "Fairy Tales"], ["Snow Princess", "Fairy Tales"], ["Ice Queen", "Fairy Tales"], ["Little Mermaid", "Fairy Tales"], ["Forest Dwarf", "Fairy Tales"], ["Friendly Mouse", "Fairy Tales"], ["Sun", "Fun & Nature"], ["Moon", "Fun & Nature"], ["Star", "Fun & Nature"], ["Planet", "Fun & Nature"], ["Rainbow", "Fun & Nature"], ["Cloud", "Fun & Nature"], ["Flower", "Fun & Nature"], ["Tree", "Fun & Nature"], ["House", "Fun & Nature"], ["Heart", "Fun & Nature"], ["Cupcake", "Fun & Nature"], ["Ice Cream", "Fun & Nature"], ["Balloon", "Fun & Nature"], ["Gift", "Fun & Nature"], ["Robot", "Fun & Nature"]];const symbols=["🐱", "🐶", "🐰", "🐘", "🦁", "🐯", "🐻", "🐼", "🐒", "🦒", "🦓", "🦛", "🐊", "🐢", "🦋", "🐝", "🐟", "🐬", "🐳", "🐙", "🐧", "🦉", "🦜", "🐸", "🐴", "🍎", "🍌", "🍊", "🍓", "🍉", "🍍", "🍇", "🥭", "🍐", "🍒", "🍑", "🍋", "🥝", "🧡", "🐉", "🥕", "🥦", "🍅", "🌽", "🎃", "🍆", "🥒", "🫑", "🍄", "🥔", "🧅", "🥬", "🫛", "🌱", "🥬", "🚗", "🚌", "🚚", "🚆", "✈️", "🚁", "🚤", "⛵", "🚲", "🏍️", "🚒", "🚑", "🚀", "🚜", "🚢", "👸", "🤴", "🧚", "🧜‍♀️", "🦄", "🐲", "🏰", "🪄", "👠", "🎠", "❄️", "👑", "🧜‍♀️", "🧙", "🐭", "☀️", "🌙", "⭐", "🪐", "🌈", "☁️", "🌸", "🌳", "🏠", "❤️", "🧁", "🍦", "🎈", "🎁", "🤖"];const colors=['#1f2937','#ffffff','#f04444','#f59e0b','#facc15','#79c957','#16b5a1','#3baff4','#5553dd','#9d60d7','#ef78b8','#a96838','#c4b5fd','#f5b895','#777777'];let index=0,color='#f04444',filter='All',strokes=[],active=null;const $=x=>document.getElementById(x),canvas=$('canvas'),ctx=canvas.getContext('2d');
function sizeCanvas(){const r=$('canvasbox').getBoundingClientRect(),w=Math.round(r.width*devicePixelRatio),h=Math.round(r.height*devicePixelRatio);canvas.width=w;canvas.height=h;drawAll()}
function drawAll(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of strokes){ctx.beginPath();ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=s.w*devicePixelRatio;ctx.lineCap='round';ctx.lineJoin='round';s.p.forEach(([x,y],i)=>i?ctx.lineTo(x*canvas.width,y*canvas.height):ctx.moveTo(x*canvas.width,y*canvas.height));if(s.p.length===1){const [x,y]=s.p[0];ctx.beginPath();ctx.arc(x*canvas.width,y*canvas.height,s.w*devicePixelRatio/2,0,Math.PI*2);ctx.fill()}else ctx.stroke()}}
function persist(){try{localStorage.setItem('audelia-draw-'+index,JSON.stringify(strokes))}catch(e){}}
function load(){strokes=JSON.parse(localStorage.getItem('audelia-draw-'+index)||'[]');$('title').textContent=(index+1)+'. '+pages[index][0];$('picture').textContent=symbols[index];$('counter').textContent=(index+1)+' / 100';sizeCanvas();browse()}
function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);active={c:color,w:+$('brush').value,p:[point(e)]};strokes.push(active);drawAll()});canvas.addEventListener('pointermove',e=>{if(!active)return;active.p.push(point(e));drawAll()});function stop(){if(active){active=null;persist()}}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
function browse(){const b=$('browse');b.replaceChildren();pages.forEach(([name,cat],i)=>{if(filter!=='All'&&cat!==filter)return;const n=document.createElement('button');n.textContent=(i+1)+'. '+symbols[i]+' '+name;n.className=i===index?'active':'';n.onclick=()=>{index=i;load()};b.append(n)})}
colors.forEach(c=>{const n=document.createElement('button');n.className='swatch'+(c===color?' active':'');n.style.background=c;n.setAttribute('aria-label','Select '+c);n.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(b=>b.classList.remove('active'));n.classList.add('active')};$('palette').append(n)});
['All','Animals','Fruits','Vegetables','Vehicles','Fairy Tales','Fun & Nature'].forEach(cat=>{const b=document.createElement('button');b.textContent=cat;b.onclick=()=>{filter=cat;document.querySelectorAll('#filters button').forEach(n=>n.classList.remove('active'));b.classList.add('active');browse()};if(cat==='All')b.classList.add('active');$('filters').append(b)});
$('prev').onclick=()=>{index=(index+99)%100;load()};$('next').onclick=()=>{index=(index+1)%100;load()};$('undo').onclick=()=>{strokes.pop();persist();drawAll()};$('clear').onclick=()=>{if(confirm('Clear this page?')){strokes=[];persist();drawAll()}};$('save').onclick=()=>{const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,c.width,c.height);x.font=Math.floor(c.height*.4)+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.globalAlpha=.3;x.fillText(symbols[index],c.width/2,c.height/2);x.globalAlpha=1;x.drawImage(canvas,0,0);const a=document.createElement('a');a.download='Audelia-'+pages[index][0].replaceAll(' ','-')+'.png';a.href=c.toDataURL('image/png');a.click()};window.addEventListener('resize',sizeCanvas);load();
</script></body></html>
