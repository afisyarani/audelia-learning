<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>English Phonics &amp; Spelling — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🔤 English Phonics &amp; Spelling</h1><p>Sound out and spell words</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>const data=[["cat", "\ud83d\udc31"], ["bat", "\ud83e\udd87"], ["sun", "\u2600\ufe0f"], ["dog", "\ud83d\udc36"], ["pen", "\ud83d\udd8a\ufe0f"], ["hat", "\ud83c\udfa9"], ["pig", "\ud83d\udc37"], ["cup", "\ud83e\udd64"], ["bed", "\ud83d\udecf\ufe0f"], ["bus", "\ud83d\ude8c"], ["fox", "\ud83e\udd8a"], ["map", "\ud83d\uddfa\ufe0f"], ["hen", "\ud83d\udc14"], ["jam", "\ud83c\udf53"], ["net", "\ud83e\udd45"], ["red", "\ud83d\udd34"], ["top", "\ud83d\udd1d"], ["run", "\ud83c\udfc3"], ["sit", "\ud83e\ude91"], ["box", "\ud83d\udce6"]];let i=0;function show(){let [w,e]=data[i%data.length];info(`<div class="big">${e} ${w}</div><p>Tap to hear, then choose the first letter.</p><button onclick="speak('${w}')">🔊 Hear word</button><div class="options">${shuffle([w[0],...shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(x=>x!==w[0])).slice(0,3)]).map(c=>`<button data-letter="${c}">${c.toUpperCase()}</button>`).join('')}</div>`);document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{if(b.dataset.letter===w[0]){$('#feedback').textContent='⭐ Correct!';score++;$('#score').textContent='⭐ '+score;i++;setTimeout(show,750)}else $('#feedback').textContent='Try again!'})}show();</script></body></html>
