<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Bahasa Melayu Suku Kata — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>📗 Bahasa Melayu Suku Kata</h1><p>Baca suku kata dan perkataan</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>const data=[["ba", "ju", "baju", "👕"], ["bu", "ku", "buku", "📚"], ["bo", "la", "bola", "⚽"], ["ma", "ta", "mata", "👀"], ["ka", "ki", "kaki", "🦶"], ["su", "su", "susu", "🥛"], ["ro", "ti", "roti", "🍞"], ["gi", "gi", "gigi", "🦷"], ["ku", "da", "kuda", "🐴"], ["me", "ja", "meja", "🪑"], ["na", "si", "nasi", "🍚"], ["sa", "pu", "sapu", "🧹"], ["to", "pi", "topi", "🧢"], ["la", "bu", "labu", "🎃"], ["pi", "pi", "pipi", "😊"]];let i=0;function show(){let [a,b,w,e]=data[i%data.length];info(`<div class="big">${e} ${w}</div><p>Gabungkan suku kata:</p><div class="big">${a.toUpperCase()} + ?</div><button onclick="speak('${w}','ms-MY')">🔊 Dengar</button><div class="options">${shuffle([b,...shuffle(['ka','la','mi','bu','ta','na','di'].filter(x=>x!==b)).slice(0,3)]).map(c=>`<button data-syl="${c}">${c.toUpperCase()}</button>`).join('')}</div>`);document.querySelectorAll('[data-syl]').forEach(x=>x.onclick=()=>{if(x.dataset.syl===b){$('#feedback').textContent='⭐ Bagus!';score++;$('#score').textContent='⭐ '+score;i++;setTimeout(show,750)}else $('#feedback').textContent='Cuba lagi!'})}show();</script></body></html>
