<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Islamic Learning — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🕌 Islamic Learning</h1><p>Doa and daily adab</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>let data=[["Before eating", "Say Bismillah"], ["After eating", "Say Alhamdulillah"], ["Greeting someone", "Say Assalamualaikum"], ["Before sleeping", "Remember Allah and make dua"], ["With parents", "Speak kindly"], ["When someone helps", "Say thank you"], ["Keeping clean", "Wash hands"], ["At the mosque", "Be respectful and quiet"], ["With friends", "Share and be kind"], ["After sneezing", "Say Alhamdulillah"]];let i=0;function show(){let [q,a]=data[i%data.length];info(`<div class="big">🌙</div><h2>${q}</h2><p class="big" style="font-size:28px">${a}</p><button id="listen">🔊 Dengar</button><button id="next">I learned this ⭐</button>`);$('#listen').onclick=()=>speak(a,'ms-MY');$('#next').onclick=()=>{score++;$('#score').textContent='⭐ '+score;i++;show()}}show();</script></body></html>
