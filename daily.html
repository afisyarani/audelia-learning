<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Daily Challenge — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🏆 Daily Challenge</h1><p>Ten questions a day</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>let done=0;function show(){if(done>=10){info(`<div class="big">🏆</div><h2>Challenge complete!</h2><p>You earned ${score} stars!</p><button onclick="location.reload()">Play again</button>`);return}let a=rand(20)+1,b=rand(20)+1,correct=a+b;choices(`<h2>Question ${done+1} / 10</h2><div class="big">${a} + ${b} = ?</div>`,[correct,correct+1,correct+2,Math.max(0,correct-1)],correct,()=>{done++;show()})}show();</script></body></html>
