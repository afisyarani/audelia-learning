<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Learn to Tell Time — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🕒 Learn to Tell Time</h1><p>Read the clock</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>function show(){let hour=1+rand(12),min=pick([0,30]),h=(hour%12)*30+min*.5,m=min*6;let svg=`<svg viewBox="0 0 240 240" width="240" aria-label="clock"><circle cx="120" cy="120" r="106" fill="#fff8d8" stroke="#5948b0" stroke-width="7"/>${Array.from({length:12},(_,i)=>{let a=(i+1)*Math.PI/6;return `<text x="${120+83*Math.sin(a)}" y="${125-83*Math.cos(a)}" text-anchor="middle" font-size="20">${i+1}</text>`}).join('')}<line x1="120" y1="120" x2="${120+54*Math.sin(h*Math.PI/180)}" y2="${120-54*Math.cos(h*Math.PI/180)}" stroke="#ec6e82" stroke-width="8" stroke-linecap="round"/><line x1="120" y1="120" x2="${120+78*Math.sin(m*Math.PI/180)}" y2="${120-78*Math.cos(m*Math.PI/180)}" stroke="#463a9b" stroke-width="5" stroke-linecap="round"/></svg>`;let a=hour+':'+(min?'30':'00');choices(svg+'<p>What time is it?</p>',[a,...shuffle(Array.from({length:12},(_,i)=>(i+1)+':'+(min?'30':'00')).filter(x=>x!==a)).slice(0,3)],a,show)}show();</script></body></html>
