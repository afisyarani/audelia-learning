<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Geography Explorer — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🌍 Geography Explorer</h1><p>Countries and flags</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>const data=[["\ud83c\uddf2\ud83c\uddfe", "Malaysia", "Kuala Lumpur"], ["\ud83c\uddef\ud83c\uddf5", "Japan", "Tokyo"], ["\ud83c\uddf9\ud83c\udded", "Thailand", "Bangkok"], ["\ud83c\uddf8\ud83c\uddec", "Singapore", "Singapore"], ["\ud83c\udde8\ud83c\uddf3", "China", "Beijing"], ["\ud83c\uddee\ud83c\udde9", "Indonesia", "Jakarta"], ["\ud83c\uddf0\ud83c\uddf7", "South Korea", "Seoul"], ["\ud83c\uddeb\ud83c\uddf7", "France", "Paris"], ["\ud83c\uddec\ud83c\udde7", "United Kingdom", "London"], ["\ud83c\udde6\ud83c\uddfa", "Australia", "Canberra"]];function show(){let [flag,c,capital]=pick(data);choices(`<div class="big">${flag}</div><p>Which country has this flag?</p>`,[c,...shuffle(data.map(x=>x[1]).filter(x=>x!==c)).slice(0,3)],c,()=>{$('#feedback').textContent='Capital: '+capital;setTimeout(show,800)})}show();</script></body></html>
