<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7356dc"><title>Geography Explorer | Audelia Learning World</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#27324e;background:#fff8ed}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#8057df,#d66bb1);color:white;text-align:center;padding:24px 14px}h1{margin:0;font-size:clamp(26px,5vw,38px)}header p{margin:8px 0 0}main{max-width:850px;margin:auto;padding:18px}.home,button{border:0;border-radius:15px;padding:15px 20px;font-size:17px;font-weight:750;cursor:pointer;touch-action:manipulation}.home{display:inline-block;background:#6d51dd;color:white;text-decoration:none;margin-bottom:16px}.card{background:white;border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:0 6px 25px #24335a12;text-align:center}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.score{font-weight:800;color:#6c4cc9}.tag{background:#f1edff;border-radius:20px;padding:8px 12px;font-size:14px}.flagbox{height:190px;display:flex;align-items:center;justify-content:center;margin:12px auto}.flagbox img{max-width:min(300px,90%);max-height:180px;width:auto;height:auto;box-shadow:0 4px 16px #17213c30;border:1px solid #ddd;border-radius:4px}.flag-fallback{display:none;font-size:22px;font-weight:700}h2{font-size:clamp(24px,5vw,35px);margin:14px 0 24px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.options button{background:#6d51dd;color:white;min-height:65px}.options button:disabled{opacity:.8;cursor:default}.options button.correct{background:#17845a}.options button.wrong{background:#d04c58}.feedback{min-height:55px;margin-top:18px;font-size:20px;font-weight:750}.next{background:#ffca55;color:#292d45;margin-top:6px}.tip{font-size:13px;color:#68728b;margin-top:18px}footer{text-align:center;color:#67718a;padding:18px}@media(max-width:460px){.options{grid-template-columns:1fr}.flagbox{height:150px}.flagbox img{max-height:140px}}
</style></head><body><header><h1>🌍 Geography Explorer</h1><p>Discover countries, flags and capital cities!</p></header><main><a class="home" href="index.html">🏠 Home</a><section class="card"><div class="top"><span class="score" id="score">⭐ 0 stars</span><span class="tag" id="progress">Question 1</span></div><div class="flagbox"><img id="flag" alt="Flag to identify" referrerpolicy="no-referrer"><span class="flag-fallback" id="fallback">Flag image unavailable</span></div><h2>Which country has this flag?</h2><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" hidden>Next flag ➜</button><p class="tip">Flags are loaded as real images, not emoji. An internet connection is needed to show them.</p></section></main><footer>Made for Audelia 💖 • Play and learn together</footer><script>
const countries=[['my','Malaysia','Kuala Lumpur'],['jp','Japan','Tokyo'],['th','Thailand','Bangkok'],['sg','Singapore','Singapore'],['cn','China','Beijing'],['id','Indonesia','Jakarta'],['kr','South Korea','Seoul'],['fr','France','Paris'],['gb','United Kingdom','London'],['au','Australia','Canberra'],['us','United States','Washington, D.C.'],['de','Germany','Berlin'],['it','Italy','Rome'],['in','India','New Delhi'],['vn','Vietnam','Hanoi'],['ph','Philippines','Manila'],['nz','New Zealand','Wellington'],['ca','Canada','Ottawa'],['br','Brazil','Brasília'],['tr','Türkiye','Ankara']];
const $=id=>document.getElementById(id);const shuffle=a=>[...a].sort(()=>Math.random()-.5);let stars=0,count=0,current=null,previous='';function show(){let pool=countries.filter(x=>x[0]!==previous);current=pool[Math.floor(Math.random()*pool.length)];previous=current[0];count++;$('progress').textContent='Question '+count;$('feedback').textContent='';$('next').hidden=true;$('fallback').style.display='none';$('flag').style.display='block';$('flag').src='https://flagcdn.com/w320/'+current[0]+'.png';$('flag').alt='Flag quiz image';$('flag').onerror=()=>{$('flag').style.display='none';$('fallback').style.display='block'};let answers=shuffle([current[1],...shuffle(countries.filter(x=>x[0]!==current[0])).slice(0,3).map(x=>x[1])]);$('options').innerHTML='';answers.forEach(name=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>check(name,b);$('options').append(b)})}function check(name,button){if($('next').hidden===false)return;if(name===current[1]){stars++;$('score').textContent='⭐ '+stars+' stars';$('feedback').textContent='🎉 Correct! Capital: '+current[2];button.classList.add('correct');$('options').querySelectorAll('button').forEach(b=>b.disabled=true);$('next').hidden=false}else{button.classList.add('wrong');button.disabled=true;$('feedback').textContent='💛 Try again!'}}$('next').onclick=show;show();
</script></body></html>
