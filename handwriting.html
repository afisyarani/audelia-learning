<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Handwriting Practice — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>✍️ Handwriting Practice</h1><p>Trace letters and numbers</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>let letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split(''),i=0;info('<p>Trace the pale letter with your finger or Apple Pencil.</p><div class="big" id="target">A</div><canvas id="pad" width="650" height="350"></canvas><div><button id="clear">🧽 Clear</button><button id="next">Next ➡️</button></div>');let c=$('#pad'),ctx=c.getContext('2d'),drawing=false;function guide(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#e7e5f5';ctx.font='bold 260px system-ui';ctx.textAlign='center';ctx.fillText(letters[i],325,270);$('#target').textContent=letters[i]}guide();function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(!drawing)return;ctx.lineWidth=12;ctx.lineCap='round';ctx.strokeStyle='#7b4dde';ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=()=>drawing=false;$('#clear').onclick=guide;$('#next').onclick=()=>{i=(i+1)%letters.length;guide()};</script></body></html>
