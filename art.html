<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Art &amp; Colouring — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🎨 Art &amp; Colouring</h1><p>Draw and colour</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>info('<p>Pick a colour and draw with your finger!</p><div class="options" id="palette"></div><canvas id="pad" width="650" height="450"></canvas><p><button id="clear">Clear drawing</button></p>');let c=$('#pad'),ctx=c.getContext('2d'),color='#e65777',down=false;['#e65777','#ffbd42','#45b37d','#4b8fdc','#8156d9','#222222','#ffffff'].forEach(col=>{let b=document.createElement('button');b.style.background=col;b.style.border='2px solid #777';b.textContent='●';b.onclick=()=>color=col;$('#palette').append(b)});function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(!down)return;ctx.strokeStyle=color;ctx.lineWidth=13;ctx.lineCap='round';ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=()=>down=false;$('#clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height);</script></body></html>
