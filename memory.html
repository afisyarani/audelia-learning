<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7554dd"><title>Memory Match — Audelia Learning World</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>🧩 Memory Match</h1><p>Find matching pairs</p></header><main><a class="btn" href="index.html">🏠 Home</a><div class="card"><div id="score">⭐ 0</div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div></div></main><footer>Made for Audelia 💖 • Play and learn together</footer><script src="assets/common.js"></script><script>let icons=['🐱','🐶','🐸','🐼','🦁','🐰'];let deck=shuffle([...icons,...icons]),first=null,matched=0,busy=false;info('<p>Find all six matching pairs.</p><div id="board" class="grid" style="grid-template-columns:repeat(4,1fr)"></div>');deck.forEach((x,i)=>{let b=document.createElement('button');b.textContent='❓';b.dataset.icon=x;b.onclick=()=>{if(busy||b.disabled||b===first)return;b.textContent=x;if(!first){first=b;return}if(first.dataset.icon===x){first.disabled=b.disabled=true;matched++;score++;$('#score').textContent='⭐ '+score;first=null;if(matched===6)$('#feedback').textContent='🎉 All matched! Refresh to play again.'}else{busy=true;let prev=first;first=null;setTimeout(()=>{prev.textContent=b.textContent='❓';busy=false},850)}};$('#board').append(b)});</script></body></html>
